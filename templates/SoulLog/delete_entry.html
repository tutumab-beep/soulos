{% extends "base.html" %}
{% load static %}

{% block title %}Delete SoulLog Entry{% endblock %}

{% block content %}
<div>
    <h1>Delete SoulLog Entry</h1>
    <p>Are you sure you want to delete this entry?</p>
    <p>{{ entry.content|linebreaks }}</p>
    <small>{{ entry.created_at|date:"M d, Y H:i" }}</small>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
    </form>
    <a href="{% url 'SoulLog:journal' %}">Cancel</a>
</div>
{% endblock %}
