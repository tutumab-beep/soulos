<div class="alert alert-{{ type|default:'info' }} {% if class %}{{ class }}{% endif %}" role="alert" {% if dismissible %}data-dismissible{% endif %}>
    {% if icon %}
        <div class="alert-icon" aria-hidden="true">
            {% if type == 'success' %}
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            {% elif type == 'error' %}
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="15" y1="9" x2="9" y2="15"/>
                    <line x1="9" y1="9" x2="15" y2="15"/>
                </svg>
            {% elif type == 'warning' %}
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            {% else %}
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
            {% endif %}
        </div>
    {% endif %}

    <div class="alert-content">
        {% if title %}
            <p class="alert-title">{{ title }}</p>
        {% endif %}
        <p class="alert-message">{{ message }}</p>
    </div>

    {% if dismissible %}
        <button type="button" class="alert-dismiss" aria-label="Dismiss" data-dismiss-alert>
            <svg class="icon icon-sm" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
    {% endif %}
</div>
