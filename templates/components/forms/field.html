<div class="form-field">
    <label for="{{ field.id_for_label }}" class="form-label{% if field.field.required %} required{% endif %}">
        {{ field.label }}
    </label>
    {{ field }}
    {% if field.help_text %}
        <div class="form-help" id="{{ field.id_for_label }}_help">{{ field.help_text }}</div>
    {% endif %}
    {% if field.errors %}
        <div class="form-error" id="{{ field.id_for_label }}_error" aria-live="polite">
            {% for error in field.errors %}
                {{ error }}
            {% endfor %}
        </div>
        {% if field.widget.input_type != 'hidden' %}
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const field = document.getElementById('{{ field.id_for_label }}');
                    if (field) field.setAttribute('aria-invalid', 'true');
                });
            </script>
        {% endif %}
    {% endif %}
</div>
