<div class="form-field">
    <label for="{{ widget.id_for_label }}" class="form-label{% if widget.attrs.required %} required{% endif %}">
        {{ widget.label }}
    </label>
    <input type="{{ widget.type }}" name="{{ widget.name }}" id="{{ widget.id_for_label }}"
           {% for attr_name, attr_value in widget.attrs.items %}
               {% if attr_name != 'required' %}{{ attr_name }}="{{ attr_value }}" {% endif %}
           {% endfor %}
           {% if widget.value %}value="{{ widget.value }}"{% endif %}>
    {% if widget.help_text %}
        <div class="form-help" id="{{ widget.id_for_label }}_help">{{ widget.help_text }}</div>
    {% endif %}
</div>
