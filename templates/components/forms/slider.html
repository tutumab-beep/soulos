<div class="form-field">
    <label for="{{ widget.id_for_label }}" class="form-label{% if widget.attrs.required %} required{% endif %}">
        {{ widget.label }}
        {% if widget.attrs.type == "range" %}
            <span class="slider-value" id="{{ widget.id_for_label }}_value">{{ widget.value|default:widget.attrs.min|default:5 }}</span>/{{ widget.attrs.max|default:10 }}
        {% endif %}
    </label>
    <input type="{{ widget.attrs.type|default:"range" }}" name="{{ widget.name }}" id="{{ widget.id_for_label }}"
           min="{{ widget.attrs.min|default:1 }}" max="{{ widget.attrs.max|default:10 }}"
           value="{{ widget.value|default:widget.attrs.min|default:5 }}"
           class="form-slider"
           {% for attr_name, attr_value in widget.attrs.items %}
               {% if attr_name not in 'type min max required' %}{{ attr_name }}="{{ attr_value }}" {% endif %}
           {% endfor %}>
    {% if widget.help_text %}
        <div class="form-help" id="{{ widget.id_for_label }}_help">{{ widget.help_text }}</div>
    {% endif %}
</div>
