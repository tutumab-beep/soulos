{% extends "base.html" %}
{% block title %}Alignment Practice - SoulOS{% endblock %}
{% block content %}
<a href="{% url 'core_healing_path:transformation_log' %}">← Back to Transformation Log</a>
<h1>Alignment Practice</h1>
<p>What ritual will you practice today?</p>
<form method="post" action="{% url 'core_healing_path:log_alignment_practice' %}">
    {% csrf_token %}
    <input type="hidden" name="stage" value="alignment_practice">
    <label>Ritual:</label>
    <input type="text" name="ritual">
    <label>Reflection:</label>
    <textarea name="reflection" rows="4"></textarea>
    <button type="submit">Save & Continue →</button>
</form>
{% endblock %}
