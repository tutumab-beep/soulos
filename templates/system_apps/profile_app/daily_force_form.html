{% extends "base.html" %}
{% block title %}Daily Force - SoulOS{% endblock %}
{% block content %}
<div class="form-container">
    <h1>Log Daily Force</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.force_type.id_for_label }}" class="form-label">Force Type</label>
            {{ form.force_type }}
        </div>
        <div class="mb-3">
            <label for="{{ form.entry.id_for_label }}" class="form-label">Entry</label>
            {{ form.entry }}
        </div>
        <div class="mb-3">
            <label for="{{ form.date.id_for_label }}" class="form-label">Date</label>
            {{ form.date }}
        </div>
        <button type="submit" class="btn btn-primary">Save Entry</button>
        {% if back_url %}
            <a href="{{ back_url }}" class="btn btn-secondary">Cancel</a>
        {% else %}
            <a href="{% url 'profile_app:dashboard' %}" class="btn btn-secondary">Cancel</a>
        {% endif %}
    </form>
</div>
{% endblock %}
