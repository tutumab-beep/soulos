{% extends "base.html" %}
{% block title %}Progress - SoulOS{% endblock %}
{% block content %}
<div class="form-container">
    <h1>Log Progress</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.awareness_score.id_for_label }}" class="form-label">Awareness Score (0-100)</label>
            {{ form.awareness_score }}
        </div>
        <div class="mb-3">
            <label for="{{ form.numeric_log.id_for_label }}" class="form-label">Numeric Growth Log</label>
            {{ form.numeric_log }}
        </div>
        <div class="mb-3">
            <label for="{{ form.notes.id_for_label }}" class="form-label">Notes</label>
            {{ form.notes }}
        </div>
        <div class="mb-3">
            <label for="{{ form.date.id_for_label }}" class="form-label">Date</label>
            {{ form.date }}
        </div>
        <button type="submit" class="btn btn-primary">Save Progress</button>
        {% if back_url %}
            <a href="{{ back_url }}" class="btn btn-secondary">Cancel</a>
        {% else %}
            <a href="{% url 'profile_app:dashboard' %}" class="btn btn-secondary">Cancel</a>
        {% endif %}
    </form>
</div>
{% endblock %}
