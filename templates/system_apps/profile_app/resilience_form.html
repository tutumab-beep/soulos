{% extends "base.html" %}
{% block title %}Resilience - SoulOS{% endblock %}
{% block content %}
<div class="form-container">
    <h1>Log Resilience Action</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.action.id_for_label }}" class="form-label">Action</label>
            {{ form.action }}
        </div>
        <div class="mb-3">
            <label for="{{ form.description.id_for_label }}" class="form-label">Description</label>
            {{ form.description }}
        </div>
        <div class="mb-3">
            <label for="{{ form.date.id_for_label }}" class="form-label">Date</label>
            {{ form.date }}
        </div>
        <button type="submit" class="btn btn-primary">Save Entry</button>
        {% if back_url %}
            <a href="{{ back_url }}" class="btn btn-secondary">Cancel</a>
        {% else %}
            <a href="{% url 'profile_app:dashboard' %}" class="btn btn-secondary">Cancel</a>
        {% endif %}
    </form>
</div>
{% endblock %}
