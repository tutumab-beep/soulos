{% extends "base.html" %}
{% block title %}Ritual - SoulOS{% endblock %}
{% block content %}
<div class="form-container">
    <h1>Log Ritual</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.ritual_type.id_for_label }}" class="form-label">Ritual Type</label>
            {{ form.ritual_type }}
        </div>
        <div class="mb-3 form-check">
            {{ form.completed }}
            <label class="form-check-label" for="{{ form.completed.id_for_label }}">Completed</label>
        </div>
        <div class="mb-3">
            <label for="{{ form.notes.id_for_label }}" class="form-label">Notes</label>
            {{ form.notes }}
        </div>
        <div class="mb-3">
            <label for="{{ form.date.id_for_label }}" class="form-label">Date</label>
            {{ form.date }}
        </div>
        <button type="submit" class="btn btn-primary">Save Entry</button>
        {% if back_url %}
            <a href="{{ back_url }}" class="btn btn-secondary">Cancel</a>
        {% else %}
            <a href="{% url 'profile_app:dashboard' %}" class="btn btn-secondary">Cancel</a>
        {% endif %}
    </form>
</div>
{% endblock %}
